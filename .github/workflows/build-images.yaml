name: Build and Push Images

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  MCP_IMAGE: ${{ github.repository }}/odoo-mcp
  MCPOAUTH_IMAGE: ${{ github.repository }}/odoo-mcp-mcpoauth
  GO_VERSION: '1.25'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for MCP image
        id: meta-mcp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MCP_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Extract metadata for MCPOAuth image
        id: meta-mcpoauth
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.MCPOAUTH_IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build and push MCP server
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta-mcp.outputs.tags }}
          labels: ${{ steps.meta-mcp.outputs.labels }}

      - name: Build mcpoauth Linux binary
        run: GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -o /tmp/mcpoauth-linux ./cmd/mcpoauth/

      - name: Build and push MCPOAuth broker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.mcpoauth
          push: true
          tags: ${{ steps.meta-mcpoauth.outputs.tags }}
          labels: ${{ steps.meta-mcpoauth.outputs.labels }}