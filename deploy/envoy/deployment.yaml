apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo-mcp-envoy
  namespace: odoo-mcp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: odoo-mcp-envoy
  template:
    metadata:
      labels:
        app: odoo-mcp-envoy
    spec:
      containers:
      - name: envoy
        image: envoyproxy/envoy:v1.32-latest
        ports:
        - containerPort: 8088
        volumeMounts:
        - name: config
          mountPath: /etc/envoy
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: odoo-mcp-envoy
---
apiVersion: v1
kind: Service
metadata:
  name: odoo-mcp-envoy
  namespace: odoo-mcp
spec:
  type: NodePort
  selector:
    app: odoo-mcp-envoy
  ports:
  - port: 8088
    targetPort: 8088
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: odoo-mcp-envoy
  namespace: odoo-mcp
data:
  envoy.yaml: |
    admin:
      address:
        socket_address:
          address: 0.0.0.0
          port_value: 9901

    static_resources:
      listeners:
      - name: mcp_listener
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8088
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: mcp
              codec_type: AUTO
              route_config:
                name: local_route
                virtual_hosts:
                - name: mcp
                  domains: ["*"]
                  routes:
                  - match:
                      prefix: "/register"
                    route:
                      cluster: mcpoauth_service
                  - match:
                      prefix: "/authorize"
                    route:
                      cluster: mcpoauth_service
                  - match:
                      prefix: "/.well-known/oauth-authorization-server"
                    route:
                      cluster: mcpoauth_service
                  - match:
                      prefix: "/.well-known/oauth-protected-resource"
                    route:
                      cluster: mcpoauth_service
                  - match:
                      prefix: "/mcp"
                    route:
                      cluster: mcp_service
                  - match:
                      prefix: "/.well-known"
                    route:
                      cluster: mcp_service
                  - match:
                      prefix: "/register-key"
                    route:
                      cluster: mcp_service
                  - match:
                      prefix: "/health"
                    route:
                      cluster: mcp_service
                  - match:
                      prefix: "/dex"
                    route:
                      cluster: dex_service
              http_filters:
              - name: envoy.filters.http.router
                typed_config:
                  "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: mcp_service
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: mcp_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: odoo-mcp-mcp
                    port_value: 8080
      - name: dex_service
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: dex_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: odoo-mcp-dex
                    port_value: 5556
      - name: mcpoauth_service
        type: STRICT_DNS
        lb_policy: ROUND_ROBIN
        load_assignment:
          cluster_name: mcpoauth_service
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: odoo-mcp-mcpoauth
                    port_value: 8090