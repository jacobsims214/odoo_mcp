{{- if .Values.cnpg.enabled }}
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: {{ include "odoo-mcp.fullname" . }}-cnpg
  labels:
    {{- include "odoo-mcp.labels" . | nindent 4 }}
spec:
  instances: {{ .Values.cnpg.instances }}
  storage:
    size: {{ .Values.cnpg.storageSize }}
  enableSuperuserAccess: true  # Creates {cluster}-superuser secret with postgres password
  bootstrap:
    initdb:
      databases:              # CNPG requires databases under bootstrap.initdb, not at spec root
        mcp: {}               # Creates database named mcp
        dex: {}               # Creates database named dex
  postgresql:
    parameters:
      max_connections: "200"
      shared_buffers: "256MB"
  monitoring:
    enablePodMonitor: {{ .Values.cnpg.monitoring.enabled }}
{{- end }}