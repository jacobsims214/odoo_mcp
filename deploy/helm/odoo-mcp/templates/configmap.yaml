apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoo-mcp.fullname" . }}-config
  labels:
    {{- include "odoo-mcp.labels" . | nindent 4 }}
data:
  ODOO_MCP_TRANSPORT: {{ .Values.mcp.env.ODOO_MCP_TRANSPORT | quote }}
  ODOO_MCP_ADDR: {{ .Values.mcp.env.ODOO_MCP_ADDR | quote }}
  ODOO_MCP_AUTH_MODE: {{ .Values.mcp.env.ODOO_MCP_AUTH_MODE | quote }}
  ODOO_READ_ONLY: {{ .Values.mcp.env.ODOO_READ_ONLY | quote }}
  ODOO_RATE_LIMIT_RPS: {{ .Values.mcp.env.ODOO_RATE_LIMIT_RPS | quote }}
  ODOO_BLOCKED_MODELS: {{ .Values.mcp.env.ODOO_BLOCKED_MODELS | quote }}
  ODOO_LOG_LEVEL: {{ .Values.mcp.env.ODOO_LOG_LEVEL | quote }}
  ODOO_AUDIT_LOG: {{ .Values.mcp.env.ODOO_AUDIT_LOG | quote }}
  ODOO_TIMEOUT: {{ .Values.mcp.env.ODOO_TIMEOUT | quote }}
  VALKEY_ADDR: {{ printf "%s-valkey-primary:%v" .Release.Name (.Values.valkey.primary.service.ports.valkey | default 6379) | quote }}
  DEX_ISSUER_URL: {{ required "dex.issuerURL is required when dex is enabled" .Values.dex.issuerURL | quote }}
  DEX_INTERNAL_URL: {{ printf "http://%s-dex:%v/dex" (include "odoo-mcp.fullname" .) (.Values.dex.service.port | default 5556) | quote }}
  STATELESS_SESSIONS: {{ .Values.mcp.env.STATELESS_SESSIONS | default "false" | quote }}
  ODOO_MCP_PUBLIC_URL: {{ .Values.mcp.env.ODOO_MCP_PUBLIC_URL | quote }}
  DEX_PUBLIC_URL: {{ .Values.mcp.env.DEX_PUBLIC_URL | quote }}
  DEX_GRPC_ADDR: {{ printf "%s-dex:5557" (include "odoo-mcp.fullname" .) | quote }}
  DATABASE_URL: {{ .Values.mcp.env.DATABASE_URL | default (printf "postgres://postgres@%s-cnpg-rw.%s.svc.cluster.local:5432/mcp?sslmode=disable" (include "odoo-mcp.fullname" .) .Release.Namespace) | quote }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "odoo-mcp.fullname" . }}-dex-config
  labels:
    {{- include "odoo-mcp.labels" . | nindent 4 }}
data:
  config.yaml: |
    issuer: {{ .Values.dex.issuerURL | quote }}
    storage:
      type: postgres
      config:
        host: {{ .Values.dex.database.host | default (printf "%s-cnpg-rw.%s.svc.cluster.local" (include "odoo-mcp.fullname" .) .Release.Namespace) | quote }}
        port: 5432
        database: dex
        user: {{ .Values.dex.database.user | default "postgres" | quote }}
        password: ${DEX_DB_PASSWORD}
        ssl:
          mode: disable
    web:
      http: 0.0.0.0:5556
    grpc:
      addr: 0.0.0.0:5557
    oauth2:
      skipApprovalScreen: true
      passwordConnector: local
    enablePasswordDB: true
    staticClients:
    - id: odoo-mcp
      name: Odoo MCP
      public: true
    - id: admin-ui
      name: Admin UI
      public: true
      redirectURIs:
      {{- if .Values.ingress.enabled }}
      - https://{{ .Values.ingress.hostname }}/admin
      {{- else }}
      - http://localhost:8088/admin
      {{- end }}
    - id: claude-desktop
      name: Claude Desktop
      public: true
      redirectURIs:
      - https://claude.ai/api/mcp/auth_callback