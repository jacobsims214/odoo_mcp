apiVersion: v1
kind: Secret
metadata:
  name: {{ include "odoo-mcp.fullname" . }}-secrets
  labels:
    {{- include "odoo-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- $secretName := printf "%s-secrets" (include "odoo-mcp.fullname" .) }}
  {{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
  {{- if .Values.secrets.dexClientSecret }}
  DEX_CLIENT_SECRET: {{ .Values.secrets.dexClientSecret | b64enc }}
  {{- else if $existing }}
  DEX_CLIENT_SECRET: {{ index $existing.data "DEX_CLIENT_SECRET" }}
  {{- else }}
  DEX_CLIENT_SECRET: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.dexDbPassword }}
  DEX_DB_PASSWORD: {{ .Values.secrets.dexDbPassword | b64enc }}
  {{- else if $existing }}
  DEX_DB_PASSWORD: {{ index $existing.data "DEX_DB_PASSWORD" }}
  {{- else }}
  DEX_DB_PASSWORD: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.mcp.env.ODOO_API_KEY }}
  ODOO_API_KEY: {{ .Values.mcp.env.ODOO_API_KEY | b64enc }}
  {{- end }}
  {{- if .Values.secrets.keyStoreEncryptionKey }}
  KEY_STORE_ENCRYPTION_KEY: {{ .Values.secrets.keyStoreEncryptionKey | b64enc }}
  {{- else if $existing }}
  KEY_STORE_ENCRYPTION_KEY: {{ index $existing.data "KEY_STORE_ENCRYPTION_KEY" }}
  {{- else }}
  KEY_STORE_ENCRYPTION_KEY: {{ randAlphaNum 64 | sha256sum | b64enc | quote }}
  {{- end }}