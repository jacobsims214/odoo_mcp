{{- if .Values.dex.enabled }}
{{- $secretName := printf "%s-dex-grpc-tls" (include "odoo-mcp.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  annotations:
    helm.sh/resource-policy: keep
  labels:
    {{- include "odoo-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: dex
type: Opaque
data:
  {{- if $existing }}
  ca.crt: {{ index $existing.data "ca.crt" }}
  tls.crt: {{ index $existing.data "tls.crt" }}
  tls.key: {{ index $existing.data "tls.key" }}
  client.crt: {{ index $existing.data "client.crt" }}
  client.key: {{ index $existing.data "client.key" }}
  {{- else }}
  ca.crt: {{ .Values.dex.grpcTls.caCert | default "" | b64enc }}
  tls.crt: {{ .Values.dex.grpcTls.serverCert | default "" | b64enc }}
  tls.key: {{ .Values.dex.grpcTls.serverKey | default "" | b64enc }}
  client.crt: {{ .Values.dex.grpcTls.clientCert | default "" | b64enc }}
  client.key: {{ .Values.dex.grpcTls.clientKey | default "" | b64enc }}
  {{- end }}
{{- end }}