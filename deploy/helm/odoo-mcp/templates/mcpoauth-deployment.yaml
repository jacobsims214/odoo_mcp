{{- if .Values.mcpoauth.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "odoo-mcp.fullname" . }}-mcpoauth
  labels:
    {{- include "odoo-mcp.labels" . | nindent 4 }}
    app.kubernetes.io/component: mcpoauth
spec:
  replicas: {{ .Values.mcpoauth.replicaCount }}
  selector:
    matchLabels:
      {{- include "odoo-mcp.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: mcpoauth
  template:
    metadata:
      labels:
        {{- include "odoo-mcp.labels" . | nindent 8 }}
        app.kubernetes.io/component: mcpoauth
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | default "{}" | nindent 8 }}
      containers:
        - name: mcpoauth
          securityContext:
            {{- toYaml .Values.securityContext | default "{}" | nindent 12 }}
          image: "{{ .Values.mcpoauth.image.repository }}:{{ .Values.mcpoauth.image.tag }}"
          imagePullPolicy: {{ .Values.mcpoauth.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.mcpoauth.port }}
              protocol: TCP
          env:
            - name: BROKER_PORT
              value: {{ .Values.mcpoauth.env.BROKER_PORT | quote }}
            - name: BROKER_PUBLIC_URL
              value: {{ .Values.mcpoauth.env.BROKER_PUBLIC_URL | quote }}
            - name: DEX_URL
              value: {{ .Values.mcpoauth.env.DEX_URL | quote }}
            - name: MCP_PUBLIC_URL
              value: {{ .Values.mcpoauth.env.MCP_PUBLIC_URL | quote }}
            - name: DEX_GRPC_ADDR
              value: {{ .Values.mcpoauth.env.DEX_GRPC_ADDR | quote }}
          volumeMounts: []
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 2
          resources:
            {{- toYaml .Values.mcpoauth.resources | nindent 12 }}
      volumes: []
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}