# ── AvWare Production Values for Odoo MCP ───────────────────────────────────────
# Deployed to AvWare EKS cluster via AWS ALB controller ingress.
# Uses existing CNPG PostgreSQL database for Dex storage.
# No TLS for internal cluster gRPC communication (Dex <-> mcpoauth).
# TLS is terminated at the ALB via AWS Certificate Manager.

# ── Global ──────────────────────────────────────────────────────────────────────
global:
  domain: odoo-mcp.cloud.avware.io

# ── MCP Server ──────────────────────────────────────────────────────────────────
mcp:
  replicaCount: 3

  image:
    repository: ghcr.io/jacobsims214/odoo_mcp/odoo-mcp
    tag: latest
    pullPolicy: Always

  env:
    # ── Authentication ────────────────────────────────────────────────────
    ODOO_MCP_AUTH_MODE: "per-session"
    STATELESS_SESSIONS: "true"

    # ── URLs ──────────────────────────────────────────────────────────────
    ODOO_MCP_PUBLIC_URL: "https://odoo-mcp.cloud.avware.io/mcp"
    DEX_PUBLIC_URL: "https://odoo-mcp.cloud.avware.io/dex"
    DEX_INTERNAL_URL: "http://odoo-mcp-dex:5556/dex"

    # ── Odoo Connection ───────────────────────────────────────────────────
    ODOO_TIMEOUT: "30s"

    # ── Transport ─────────────────────────────────────────────────────────
    ODOO_MCP_TRANSPORT: "http"
    ODOO_MCP_ADDR: ":8080"

    # ── Guardrails (Security & Performance) ────────────────────────────────
    ODOO_BLOCKED_MODELS: ""
    ODOO_READ_ONLY: "false"
    ODOO_RATE_LIMIT_RPS: "10"

    # ── Logging & Audit ───────────────────────────────────────────────────
    ODOO_LOG_LEVEL: "info"
    ODOO_AUDIT_LOG: "true"

  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

# ── Dex (OIDC Provider) ────────────────────────────────────────────────────────
dex:
  replicaCount: 2

  issuerURL: "https://odoo-mcp.cloud.avware.io/dex"

  # ── Database ────────────────────────────────────────────────────────────
  # Host is auto-templated from CNPG cluster name — unset to use the default
  # database:
  #   host: cnpg-cluster-rw.namespace.svc.cluster.local

  # Dex uses existing CNPG database — no PVC needed
  persistence:
    enabled: false
    size: 1Gi
    storageClass: ""
    accessMode: ReadWriteOnce
    existingClaim: ""

  # No TLS for internal cluster gRPC communication
  grpcTls: {}

  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi

# ── MCP OAuth Broker (mcpoauth) ────────────────────────────────────────────────
mcpoauth:
  enabled: true
  replicaCount: 2

  image:
    repository: ghcr.io/jacobsims214/odoo_mcp/odoo-mcp-mcpoauth
    tag: latest
    pullPolicy: Always

  env:
    BROKER_PORT: "8090"
    BROKER_PUBLIC_URL: "https://odoo-mcp.cloud.avware.io"
    DEX_PUBLIC_URL: "https://odoo-mcp.cloud.avware.io"
    DEX_URL: "http://odoo-mcp-dex:5556/dex"
    MCP_PUBLIC_URL: "https://odoo-mcp.cloud.avware.io/mcp"
    # Dex gRPC — no TLS for internal cluster communication
    DEX_GRPC_ADDR: "odoo-mcp-dex:5557"

  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# ── Envoy ───────────────────────────────────────────────────────────────────────
# Envoy sits as the gateway behind the ALB, routing traffic to the correct backend
# (MCP, Dex, mcpoauth) based on path prefixes.
envoy:
  enabled: true
  replicaCount: 2
  image:
    repository: envoyproxy/envoy
    tag: v1.32-latest
    pullPolicy: IfNotPresent
  port: 8088
  adminPort: 9901

# ── Ingress (AWS ALB) ──────────────────────────────────────────────────────────
# The ALB terminates TLS and forwards all traffic to the Envoy service,
# which handles path-based routing internally (MCP, Dex, mcpoauth).
ingress:
  enabled: true
  className: "alb"
  hostname: odoo-mcp.cloud.avware.io

  # TLS is terminated at the ALB via certificate ARN annotation
  # Do not use the standard K8s TLS block — ALB manages TLS itself
  tls:
    enabled: false

  annotations:
    alb.ingress.kubernetes.io/backend-protocol: HTTP
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/subnets: subnet-06e6f97647d2b3469,subnet-0b5e29dfa7c870ced,subnet-0b4946ca1756defa9
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/healthcheck-protocol: HTTP
    alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:us-east-1:445567109615:certificate/c072b2a1-5295-4209-86f9-02a6ff45c511"
    kubernetes.io/ingress.class: alb

# ── Valkey (Session Cache) ─────────────────────────────────────────────────────
valkey:
  enabled: true
  architecture: standalone

  auth:
    enabled: false
    sentinel: false

  primary:
    persistence:
      enabled: true
      size: 5Gi
      storageClass: ""

# ── CloudNative PG (CNPG) Cluster ───────────────────────────────────────────
cnpg:
  enabled: true
  instances: 2
  storageSize: 10Gi
  databases:
    mcp: mcp
    dex: dex
  monitoring:
    enabled: true

# ── Secrets (set via --set or External Secrets Operator) ───────────────────────
secrets:
  # Dex PostgreSQL password for the existing CNPG database
  # Retrieve from: kubectl get secret -n amp amp-postgres-app -o jsonpath='{.data.password}' | base64 -d
  dexDbPassword: ""
  # Dex OIDC client shared secret
  dexClientSecret: ""
